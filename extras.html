<script>
(function () {
  var stacks = document.querySelectorAll('.stack');

  /* If an open album is wider than the column, slide it sideways as the mouse moves */
  stacks.forEach(function (stack) {
    var track = stack.querySelector('.stack-track');
    stack.addEventListener('mousemove', function (e) {
      if (!track.matches(':hover') || stack.classList.contains('is-active')) return;
      var box = stack.getBoundingClientRect();
      var extra = track.scrollWidth - box.width;
      if (extra <= 0) { track.style.transform = ''; return; }
      var t = Math.min(1, Math.max(0, (e.clientX - box.left) / box.width));
      track.style.transform = 'translateX(' + (-extra * t) + 'px)';
    });
    stack.addEventListener('mouseleave', function () {
      if (!stack.classList.contains('is-active')) track.style.transform = '';
    });
  });

  /* Click or tap an image to enlarge it and dim the page. Choose another image to switch.
     Click or tap anywhere else (or press Esc) to go back to normal.
     Desktop: the image enlarges in place. Phones and tablets: an enlarged copy
     appears in the middle of the screen. */
  var desktop = window.matchMedia('(hover: hover) and (min-width: 801px)');

  var dim = document.createElement('div');
  dim.className = 'dim';
  document.body.appendChild(dim);

  var zoomed = document.createElement('div');
  zoomed.className = 'zoomed';
  document.body.appendChild(zoomed);

  function clearFocus() {
    dim.classList.remove('is-on');
    zoomed.classList.remove('is-on');
    stacks.forEach(function (stack) {
      stack.classList.remove('is-active');
      if (!stack.matches(':hover')) stack.querySelector('.stack-track').style.transform = '';
    });
    document.querySelectorAll('.stack-item.is-focused').forEach(function (item) {
      item.classList.remove('is-focused');
    });
  }

  document.addEventListener('click', function (e) {
    if (zoomed.contains(e.target)) return;           /* tapping the enlarged copy keeps it open */
    var item = e.target.closest ? e.target.closest('.stack-item') : null;
    if (!item) { clearFocus(); return; }

    if (desktop.matches) {
      if (item.classList.contains('is-focused')) return;
      clearFocus();
      item.classList.add('is-focused');
      item.closest('.stack').classList.add('is-active');
      dim.classList.add('is-on');
      return;
    }

    var img = item.querySelector('img');
    if (!img) { clearFocus(); return; }
    clearFocus();
    var copy = document.createElement('img');
    copy.src = img.currentSrc || img.src;
    copy.alt = img.alt;
    zoomed.innerHTML = '';
    zoomed.appendChild(copy);
    dim.classList.add('is-on');
    zoomed.classList.add('is-on');
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') clearFocus();
  });
  window.addEventListener('resize', clearFocus);
})();
</script>
