<script>
(function () {
  var stacks = document.querySelectorAll('.stack');

  /* ---- Calm hover settings: change these numbers to taste ---- */
  var OPEN_DELAY  = 140;    /* ms the mouse must rest on an album before it opens */
  var CLOSE_DELAY = 350;    /* ms after the mouse leaves before it closes */
  var SLIDE_EASE  = 0.06;   /* how quickly a wide album slides sideways (smaller = slower, calmer) */
  var EDGE_ZONE   = 0.22;   /* the middle of the album is a calm zone; sliding only happens toward the edges */

  stacks.forEach(function (stack) {
    var track = stack.querySelector('.stack-track');
    var openTimer = null, closeTimer = null, frame = null;
    var current = 0, target = 0;

    function step() {
      var diff = target - current;
      if (Math.abs(diff) < 0.4) { current = target; frame = null; }
      else { current += diff * SLIDE_EASE; frame = requestAnimationFrame(step); }
      track.style.transform = current ? 'translateX(' + current.toFixed(1) + 'px)' : '';
    }
    function slideTo(x) {
      target = x;
      if (!frame) frame = requestAnimationFrame(step);
    }
    function close() {
      if (stack.classList.contains('is-active')) return;   /* an image is enlarged: stay open */
      stack.classList.remove('is-open');
      slideTo(0);
    }
    stack._settle = function () {                           /* used when an enlarged image is closed */
      if (!track.matches(':hover')) { clearTimeout(closeTimer); closeTimer = setTimeout(close, CLOSE_DELAY); }
    };

    track.addEventListener('mouseenter', function () {
      clearTimeout(closeTimer);
      clearTimeout(openTimer);
      openTimer = setTimeout(function () { stack.classList.add('is-open'); }, OPEN_DELAY);
    });
    track.addEventListener('mouseleave', function () {
      clearTimeout(openTimer);
      clearTimeout(closeTimer);
      closeTimer = setTimeout(close, CLOSE_DELAY);
    });

    /* If the open album is wider than the column, slide it gently as the mouse nears an edge */
    stack.addEventListener('mousemove', function (e) {
      if (!stack.classList.contains('is-open') || stack.classList.contains('is-active')) return;
      var box = stack.getBoundingClientRect();
      var extra = track.scrollWidth - box.width;
      if (extra <= 0) { slideTo(0); return; }
      var p = (e.clientX - box.left) / box.width;
      var t = Math.min(1, Math.max(0, (p - EDGE_ZONE) / (1 - 2 * EDGE_ZONE)));
      slideTo(-extra * t);
    });
  });

  /* Click or tap an image to enlarge it and dim the page. Choose another image to switch.
     Click or tap anywhere else (or press Esc) to go back to normal.
     Desktop: the image enlarges in place. Phones and tablets: an enlarged copy
     appears in the middle of the screen. */
  var desktop = window.matchMedia('(hover: hover) and (min-width: 801px)');

  var dim = document.createElement('div');
  dim.className = 'dim';
  document.body.appendChild(dim);

  var zoomed = document.createElement('div');
  zoomed.className = 'zoomed';
  document.body.appendChild(zoomed);

  function clearFocus() {
    dim.classList.remove('is-on');
    zoomed.classList.remove('is-on');
    stacks.forEach(function (stack) {
      if (stack.classList.contains('is-active')) {
        stack.classList.remove('is-active');
        stack._settle();
      }
    });
    document.querySelectorAll('.stack-item.is-focused').forEach(function (item) {
      item.classList.remove('is-focused');
    });
  }

  document.addEventListener('click', function (e) {
    if (zoomed.contains(e.target)) return;           /* tapping the enlarged copy keeps it open */
    var item = e.target.closest ? e.target.closest('.stack-item') : null;
    if (!item) { clearFocus(); return; }

    if (desktop.matches) {
      if (item.classList.contains('is-focused')) return;
      clearFocus();
      item.classList.add('is-focused');
      item.closest('.stack').classList.add('is-open');
      item.closest('.stack').classList.add('is-active');
      dim.classList.add('is-on');
      return;
    }

    var img = item.querySelector('img');
    if (!img) { clearFocus(); return; }
    clearFocus();
    var copy = document.createElement('img');
    copy.src = img.currentSrc || img.src;
    copy.alt = img.alt;
    zoomed.innerHTML = '';
    zoomed.appendChild(copy);
    dim.classList.add('is-on');
    zoomed.classList.add('is-on');
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') clearFocus();
  });
  window.addEventListener('resize', clearFocus);
})();
</script>
